<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Subtitle Viewer (SRT)</title>
    <style>
      html, body {
        height: 100%;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #000;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        touch-action: manipulation;
      }

      .viewport {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .controls {
        position: sticky;
        top: 0;
        width: 100%;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: saturate(140%) blur(8px);
        -webkit-backdrop-filter: saturate(140%) blur(8px);
        padding: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        z-index: 10;
      }

      .controls label {
        font-size: 14px;
        opacity: 0.9;
        white-space: nowrap;
      }

      .controls input[type="file"] {
        color: #fff;
        border: 1px solid #333;
        background: #111;
        padding: 8px;
        border-radius: 8px;
        max-width: 50vw;
      }

      .btn {
        appearance: none;
        -webkit-appearance: none;
        background: #1f6feb;
        color: #fff;
        border: none;
        border-radius: 10px;
        padding: 10px 14px;
        font-weight: 600;
        font-size: 15px;
      }
      .btn:disabled {
        background: #2a2a2a;
        color: #888;
      }

      .btn + .timeline {
        margin-left: 6px;
      }

      .timeline {
        appearance: none;
        -webkit-appearance: none;
        flex: 1 1 220px;
        min-width: 160px;
        height: 6px;
        border-radius: 999px;
        background: #1a1a1a;
        outline: none;
        margin: 0;
        transition: background 0.15s ease;
      }

      .timeline:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }

      .timeline::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #1f6feb;
        border: none;
        box-shadow: 0 0 4px rgba(0, 0, 0, 0.4);
        cursor: pointer;
      }

      .timeline::-moz-range-thumb {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #1f6feb;
        border: none;
        box-shadow: 0 0 4px rgba(0, 0, 0, 0.4);
        cursor: pointer;
      }

      .timeline::-webkit-slider-runnable-track {
        height: 6px;
        border-radius: 999px;
        background: #1a1a1a;
      }

      .timeline::-moz-range-track {
        height: 6px;
        border-radius: 999px;
        background: #1a1a1a;
      }

      .timecode {
        font-size: 13px;
        color: #bbb;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .status {
        margin-left: auto;
        font-size: 13px;
        color: #bbb;
        white-space: nowrap;
      }

      .stage {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .subtitle {
        width: 100%;
        max-width: 1200px;
        text-align: center;
        font-size: clamp(22px, 6vw, 42px);
        line-height: 1.35;
        color: #fff;
        text-shadow:
          0 2px 2px rgba(0,0,0,0.9),
          0 0 1px rgba(0,0,0,0.9),
          0 0 12px rgba(0,0,0,0.7);
        padding: 10px 16px;
      }

      .footer-note {
        text-align: center;
        font-size: 12px;
        color: #888;
        padding: 8px 0 12px;
      }
    </style>
  </head>
  <body>
    <div class="viewport">
      <div class="controls">
        <label for="fileInput">Choose SRT:</label>
        <input id="fileInput" type="file" accept=".srt,text/plain" />
        <button id="startBtn" class="btn" disabled>Start</button>
        <button id="pauseBtn" class="btn" disabled>Pause</button>
        <input
          id="timeline"
          class="timeline"
          type="range"
          min="0"
          max="0"
          value="0"
          step="10"
          disabled
          aria-label="Scrub timeline"
        />
        <div id="timecode" class="timecode">00:00.0</div>
        <div id="status" class="status">No file loaded</div>
      </div>

      <div class="stage">
        <div id="subtitle" class="subtitle"></div>
      </div>

      <div class="footer-note">This page only displays subtitles; it does not play video.</div>
    </div>

    <script>
      (function() {
        /** @typedef {{ start: number, end: number, text: string }} Cue */

        /** @type {HTMLInputElement} */
        const fileInput = document.getElementById('fileInput');
        /** @type {HTMLButtonElement} */
        const startBtn = document.getElementById('startBtn');
        /** @type {HTMLButtonElement} */
        const pauseBtn = document.getElementById('pauseBtn');
        /** @type {HTMLInputElement} */
        const timelineEl = document.getElementById('timeline');
        /** @type {HTMLDivElement} */
        const timecodeEl = document.getElementById('timecode');
        /** @type {HTMLDivElement} */
        const subtitleEl = document.getElementById('subtitle');
        /** @type {HTMLDivElement} */
        const statusEl = document.getElementById('status');
        /** @type {HTMLDivElement | null} */
        const stageEl = document.querySelector('.stage');

        /** @type {Cue[]} */
        let cues = [];
        let timerId = null;
        let playing = false;
        let startEpochMs = 0;
        let pausedElapsedMs = 0; // elapsed time when paused
        let currentIndex = 0;
        let currentTimeMs = 0;
        let durationMs = 0;
        let scrubbing = false;
        let resumeAfterScrub = false;
        let lastStatusUpdateMs = 0;

        function escapeHtml(unsafe) {
          return String(unsafe)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
        }

        function msFromTimestamp(h, m, s, ms) {
          return ((h * 60 + m) * 60 + s) * 1000 + ms;
        }

        function parseTimeToMs(timeStr) {
          // 00:01:23,456
          const m = timeStr.match(/(\d{2}):(\d{2}):(\d{2}),(\d{3})/);
          if (!m) return 0;
          const h = Number(m[1]);
          const min = Number(m[2]);
          const s = Number(m[3]);
          const ms = Number(m[4]);
          return msFromTimestamp(h, min, s, ms);
        }

        function parseSrt(text) {
          const normalized = String(text).replace(/\r/g, '');
          const blocks = normalized.split(/\n\s*\n/);
          /** @type {Cue[]} */
          const parsed = [];
          for (const block of blocks) {
            const lines = block.split('\n').filter(Boolean);
            if (lines.length < 2) continue;

            // Some SRTs start with a numeric index on the first line.
            // Find the timing line: it should contain -->
            let timeLineIdx = 0;
            if (lines[0].includes('-->')) {
              timeLineIdx = 0;
            } else if (lines[1] && lines[1].includes('-->')) {
              timeLineIdx = 1;
            } else {
              continue;
            }

            const timeLine = lines[timeLineIdx];
            const match = timeLine.match(/(\d{2}:\d{2}:\d{2},\d{3})\s*-->\s*(\d{2}:\d{2}:\d{2},\d{3})/);
            if (!match) continue;
            const start = parseTimeToMs(match[1]);
            const end = parseTimeToMs(match[2]);
            const textLines = lines.slice(timeLineIdx + 1);
            const textContent = textLines.join('\n');
            parsed.push({ start, end, text: textContent });
          }
          parsed.sort((a, b) => a.start - b.start);
          return parsed;
        }

        function setStatus(msg) {
          statusEl.textContent = msg;
        }

        function clearTimer() {
          if (timerId !== null) {
            clearInterval(timerId);
            timerId = null;
          }
        }

        function clamp(value, min, max) {
          return Math.min(Math.max(value, min), max);
        }

        function formatTime(ms) {
          if (!Number.isFinite(ms) || ms < 0) ms = 0;
          const totalSeconds = Math.floor(ms / 1000);
          const remainderMs = Math.floor(ms % 1000);
          const hours = Math.floor(totalSeconds / 3600);
          const minutes = Math.floor((totalSeconds % 3600) / 60);
          const seconds = totalSeconds % 60;
          const tenths = Math.floor(remainderMs / 100);
          if (hours > 0) {
            return `${hours}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${tenths}`;
          }
          return `${minutes}:${String(seconds).padStart(2, '0')}.${tenths}`;
        }

        function findCueIndexFor(timeMs) {
          if (!cues.length) return -1;
          let low = 0;
          let high = cues.length - 1;
          while (low <= high) {
            const mid = (low + high) >> 1;
            const cue = cues[mid];
            if (timeMs < cue.start) {
              high = mid - 1;
            } else if (timeMs > cue.end) {
              low = mid + 1;
            } else {
              return mid;
            }
          }
          return -1;
        }

        function renderSubtitleAt(timeMs) {
          if (!cues.length) {
            if (subtitleEl.innerHTML !== '') subtitleEl.innerHTML = '';
            currentIndex = 0;
            return;
          }
          const activeIndex = findCueIndexFor(timeMs);
          if (activeIndex === -1) {
            if (subtitleEl.innerHTML !== '') subtitleEl.innerHTML = '';
            const nextIndex = cues.findIndex((cue) => cue.start > timeMs);
            currentIndex = nextIndex === -1 ? cues.length : nextIndex;
            return;
          }
          currentIndex = activeIndex;
          const cue = cues[activeIndex];
          const html = escapeHtml(cue.text).replace(/\n/g, '<br>');
          if (subtitleEl.innerHTML !== html) {
            subtitleEl.innerHTML = html;
          }
        }

        function updateTimelineUI(options = {}) {
          if (!timelineEl) return;
          const skipSlider = options.skipSlider === true;
          if (!cues.length) {
            if (!skipSlider) timelineEl.value = '0';
            timelineEl.disabled = true;
            timelineEl.style.background = '#1a1a1a';
            if (timecodeEl) timecodeEl.textContent = '00:00.0';
            return;
          }
          timelineEl.disabled = false;
          const sliderValue = String(Math.max(0, Math.round(currentTimeMs)));
          if (!skipSlider && !scrubbing) {
            timelineEl.value = sliderValue;
          }
          if (durationMs > 0) {
            const progress = clamp(currentTimeMs / durationMs, 0, 1);
            const percent = (progress * 100).toFixed(2) + '%';
            timelineEl.style.background = `linear-gradient(90deg, #1f6feb ${percent}, #1a1a1a ${percent})`;
          } else {
            timelineEl.style.background = '#1a1a1a';
          }
          if (timecodeEl) {
            const totalText = durationMs > 0 ? formatTime(durationMs) : '0:00.0';
            timecodeEl.textContent = `${formatTime(currentTimeMs)} / ${totalText}`;
          }
        }

        function updateStatus() {
          if (!cues.length) {
            setStatus('No file loaded');
            return;
          }
          if (playing) {
            setStatus('Playing? ' + formatTime(currentTimeMs));
          } else if (durationMs > 0 && currentTimeMs >= durationMs) {
            setStatus('Finished');
          } else {
            setStatus('Paused at ' + formatTime(currentTimeMs));
          }
          lastStatusUpdateMs = Date.now();
        }

        function setCurrentTime(timeMs, options = {}) {
          if (!cues.length) {
            currentTimeMs = 0;
            updateTimelineUI(options);
            return;
          }
          const clamped = durationMs > 0 ? clamp(timeMs, 0, durationMs) : Math.max(0, timeMs);
          currentTimeMs = clamped;
          if (!playing) {
            pausedElapsedMs = currentTimeMs;
          }
          renderSubtitleAt(currentTimeMs);
          updateTimelineUI(options);
          if (!options.skipStatus) {
            updateStatus();
          }
        }

        function resetPlaybackState() {
          clearTimer();
          playing = false;
          startEpochMs = 0;
          pausedElapsedMs = 0;
          currentIndex = 0;
          currentTimeMs = 0;
          scrubbing = false;
          resumeAfterScrub = false;
          subtitleEl.innerHTML = '';
          pauseBtn.textContent = 'Pause';
          pauseBtn.disabled = true;
          updateTimelineUI({ skipSlider: true });
        }

        function startPlayback() {
          if (!cues.length) return;
          clearTimer();
          playing = true;
          pauseBtn.disabled = false;
          pauseBtn.textContent = 'Pause';
          startEpochMs = Date.now() - currentTimeMs;
          timerId = setInterval(tick, 100);
          updateStatus();
        }

        function pauseOrResume() {
          if (!cues.length) return;
          if (playing) {
            const now = Date.now();
            pausedElapsedMs = now - startEpochMs;
            currentTimeMs = Math.max(0, pausedElapsedMs);
            playing = false;
            clearTimer();
            pauseBtn.textContent = 'Resume';
            renderSubtitleAt(currentTimeMs);
            updateTimelineUI();
            updateStatus();
          } else {
            playing = true;
            startEpochMs = Date.now() - currentTimeMs;
            pauseBtn.textContent = 'Pause';
            timerId = setInterval(tick, 100);
            updateStatus();
          }
        }

        function tick() {
          if (!playing) return;
          const elapsed = Date.now() - startEpochMs;
          currentTimeMs = Math.max(0, elapsed);
          if (durationMs > 0 && currentTimeMs >= durationMs) {
            currentTimeMs = durationMs;
          }
          renderSubtitleAt(currentTimeMs);
          updateTimelineUI();

          if (durationMs > 0 && currentTimeMs >= durationMs) {
            playing = false;
            clearTimer();
            pauseBtn.textContent = 'Resume';
            updateStatus();
            return;
          }

          if (Date.now() - lastStatusUpdateMs > 250) {
            updateStatus();
          }
        }

        fileInput.addEventListener('change', (e) => {
          const file = fileInput.files && fileInput.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              cues = parseSrt(String(reader.result || ''));
              durationMs = cues.length ? cues[cues.length - 1].end : 0;
              if (timelineEl) {
                const sliderMax = durationMs > 0 ? durationMs : 1;
                timelineEl.max = String(sliderMax);
                timelineEl.step = '10';
                timelineEl.value = '0';
              }
              if (cues.length === 0) {
                setStatus('Could not parse SRT');
                startBtn.disabled = true;
                pauseBtn.disabled = true;
                updateTimelineUI({ skipSlider: true });
                return;
              }
              resetPlaybackState();
              startBtn.disabled = false;
              pauseBtn.disabled = true;
              updateTimelineUI();
              setStatus('Loaded ' + cues.length + ' cues');
            } catch (err) {
              console.error(err);
              setStatus('Error reading SRT');
              startBtn.disabled = true;
              pauseBtn.disabled = true;
              durationMs = 0;
              resetPlaybackState();
            }
          };
          reader.onerror = () => {
            setStatus('Failed to read file');
            durationMs = 0;
            resetPlaybackState();
          };
          reader.readAsText(file);
        });

        startBtn.addEventListener('click', () => {
          if (!cues.length) return;
          setCurrentTime(0, { skipStatus: true });
          pausedElapsedMs = 0;
          startPlayback();
        });
        pauseBtn.addEventListener('click', pauseOrResume);

        if (timelineEl) {
          const beginScrub = () => {
            if (scrubbing || !cues.length) return;
            scrubbing = true;
            resumeAfterScrub = false;
            if (playing) {
              resumeAfterScrub = true;
              pauseOrResume();
            }
            setStatus('Scrubbing at ' + formatTime(currentTimeMs));
            lastStatusUpdateMs = Date.now();
          };

          const endScrub = () => {
            if (!scrubbing) return;
            scrubbing = false;
            if (resumeAfterScrub) {
              resumeAfterScrub = false;
              pauseOrResume();
            } else {
              updateStatus();
            }
          };

          timelineEl.addEventListener('pointerdown', beginScrub);
          timelineEl.addEventListener('pointerup', endScrub);
          timelineEl.addEventListener('pointercancel', endScrub);
          timelineEl.addEventListener('mousedown', beginScrub);
          timelineEl.addEventListener('mouseup', endScrub);
          timelineEl.addEventListener('touchstart', beginScrub, { passive: true });
          timelineEl.addEventListener('touchend', endScrub, { passive: true });

          timelineEl.addEventListener('input', () => {
            if (!cues.length) return;
            const value = Number(timelineEl.value);
            if (!Number.isFinite(value)) return;
            setCurrentTime(value, { skipStatus: true, skipSlider: true });
            setStatus('Scrubbing at ' + formatTime(currentTimeMs));
            lastStatusUpdateMs = Date.now();
          });

          timelineEl.addEventListener('change', () => {
            if (!cues.length) return;
            updateStatus();
          });
        }

        if (stageEl) {
          stageEl.addEventListener('wheel', (event) => {
            if (!cues.length) return;
            event.preventDefault();
            const primaryDelta = event.deltaY !== 0 ? event.deltaY : event.deltaX;
            if (!primaryDelta) return;
            const multiplier = event.ctrlKey || event.metaKey ? 5 : event.shiftKey ? 10 : 40;
            const newTime = currentTimeMs + primaryDelta * multiplier;
            const wasPlaying = playing;
            if (wasPlaying) {
              pauseOrResume();
            }
            resumeAfterScrub = false;
            scrubbing = false;
            setCurrentTime(newTime, { skipStatus: true });
            setStatus('Scrolled to ' + formatTime(currentTimeMs));
            lastStatusUpdateMs = Date.now();
          }, { passive: false });
        }

        updateTimelineUI({ skipSlider: true });

        // Prevent screen dimming as much as possible by keeping interactions simple
        // and minimizing unnecessary reflows. For iOS, consider turning off Auto-Lock in Settings for long sessions.
      })();
    </script>
  </body>
  </html>
