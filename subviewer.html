<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Subtitle Viewer (SRT)</title>
    <style>
      html, body {
        height: 100%;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #000;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        touch-action: manipulation;
      }

      .viewport {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .controls {
        position: sticky;
        top: 0;
        width: 100%;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: saturate(140%) blur(8px);
        -webkit-backdrop-filter: saturate(140%) blur(8px);
        padding: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        z-index: 10;
      }

      .controls label {
        font-size: 14px;
        opacity: 0.9;
        white-space: nowrap;
      }

      .controls input[type="file"] {
        color: #fff;
        border: 1px solid #333;
        background: #111;
        padding: 8px;
        border-radius: 8px;
        max-width: 50vw;
      }

      .time-controls {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 1;
        min-width: 220px;
      }

      .time-slider {
        flex: 1;
        accent-color: #1f6feb;
      }

      .time-display {
        font-size: 13px;
        color: #bbb;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }

      .btn {
        appearance: none;
        -webkit-appearance: none;
        background: #1f6feb;
        color: #fff;
        border: none;
        border-radius: 10px;
        padding: 10px 14px;
        font-weight: 600;
        font-size: 15px;
      }
      .btn:disabled {
        background: #2a2a2a;
        color: #888;
      }

      .status {
        margin-left: auto;
        font-size: 13px;
        color: #bbb;
        white-space: nowrap;
      }

      .stage {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .subtitle {
        width: 100%;
        max-width: 1200px;
        text-align: center;
        font-size: clamp(22px, 6vw, 42px);
        line-height: 1.35;
        color: #fff;
        text-shadow:
          0 2px 2px rgba(0,0,0,0.9),
          0 0 1px rgba(0,0,0,0.9),
          0 0 12px rgba(0,0,0,0.7);
        padding: 10px 16px;
      }

      .footer-note {
        text-align: center;
        font-size: 12px;
        color: #888;
        padding: 8px 0 12px;
      }
    </style>
  </head>
  <body>
    <div class="viewport">
      <div class="controls">
        <label for="fileInput">Choose SRT:</label>
        <input id="fileInput" type="file" accept=".srt,text/plain" />
        <button id="startBtn" class="btn" disabled>Start</button>
        <button id="pauseBtn" class="btn" disabled>Pause</button>
        <div class="time-controls">
          <input
            id="timeSlider"
            class="time-slider"
            type="range"
            min="0"
            max="0"
            value="0"
            step="50"
            disabled
          />
          <div id="timeDisplay" class="time-display">00:00:00.000 / 00:00:00.000</div>
        </div>
        <div id="status" class="status">No file loaded</div>
      </div>

      <div class="stage">
        <div id="subtitle" class="subtitle"></div>
      </div>

      <div class="footer-note">This page only displays subtitles; it does not play video.</div>
    </div>

    <script>
      (function() {
        /** @typedef {{ start: number, end: number, text: string }} Cue */

        /** @type {HTMLInputElement} */
        const fileInput = document.getElementById('fileInput');
        /** @type {HTMLButtonElement} */
        const startBtn = document.getElementById('startBtn');
        /** @type {HTMLButtonElement} */
        const pauseBtn = document.getElementById('pauseBtn');
        /** @type {HTMLDivElement} */
        const subtitleEl = document.getElementById('subtitle');
        /** @type {HTMLDivElement} */
        const statusEl = document.getElementById('status');
        /** @type {HTMLInputElement} */
        const timeSlider = document.getElementById('timeSlider');
        /** @type {HTMLDivElement} */
        const timeDisplay = document.getElementById('timeDisplay');
        /** @type {HTMLDivElement} */
        const stageEl = document.querySelector('.stage');

        /** @type {Cue[]} */
        let cues = [];
        let timerId = null;
        let playing = false;
        let startEpochMs = 0;
        let pausedElapsedMs = 0; // elapsed time when paused
        let currentIndex = 0;
        let totalDurationMs = 0;
        let userAdjustingSlider = false;

        function escapeHtml(unsafe) {
          return String(unsafe)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
        }

        function pad(num, size) {
          return String(num).padStart(size, '0');
        }

        function formatTimecode(ms) {
          const clamped = Math.max(0, Math.floor(ms));
          const totalSeconds = Math.floor(clamped / 1000);
          const milliseconds = clamped % 1000;
          const seconds = totalSeconds % 60;
          const minutes = Math.floor(totalSeconds / 60) % 60;
          const hours = Math.floor(totalSeconds / 3600);
          return `${pad(hours, 2)}:${pad(minutes, 2)}:${pad(seconds, 2)}.${pad(milliseconds, 3)}`;
        }

        function formatTimecodeShort(ms) {
          return (ms / 1000).toFixed(1) + 's';
        }

        function msFromTimestamp(h, m, s, ms) {
          return ((h * 60 + m) * 60 + s) * 1000 + ms;
        }

        function parseTimeToMs(timeStr) {
          // 00:01:23,456
          const m = timeStr.match(/(\d{2}):(\d{2}):(\d{2}),(\d{3})/);
          if (!m) return 0;
          const h = Number(m[1]);
          const min = Number(m[2]);
          const s = Number(m[3]);
          const ms = Number(m[4]);
          return msFromTimestamp(h, min, s, ms);
        }

        function parseSrt(text) {
          const normalized = String(text).replace(/\r/g, '');
          const blocks = normalized.split(/\n\s*\n/);
          /** @type {Cue[]} */
          const parsed = [];
          for (const block of blocks) {
            const lines = block.split('\n').filter(Boolean);
            if (lines.length < 2) continue;

            // Some SRTs start with a numeric index on the first line.
            // Find the timing line: it should contain -->
            let timeLineIdx = 0;
            if (lines[0].includes('-->')) {
              timeLineIdx = 0;
            } else if (lines[1] && lines[1].includes('-->')) {
              timeLineIdx = 1;
            } else {
              continue;
            }

            const timeLine = lines[timeLineIdx];
            const match = timeLine.match(/(\d{2}:\d{2}:\d{2},\d{3})\s*-->\s*(\d{2}:\d{2}:\d{2},\d{3})/);
            if (!match) continue;
            const start = parseTimeToMs(match[1]);
            const end = parseTimeToMs(match[2]);
            const textLines = lines.slice(timeLineIdx + 1);
            const textContent = textLines.join('\n');
            parsed.push({ start, end, text: textContent });
          }
          parsed.sort((a, b) => a.start - b.start);
          return parsed;
        }

        function setStatus(msg) {
          statusEl.textContent = msg;
        }

        function updateTimeUI(elapsed, { force = false } = {}) {
          if (!cues.length) {
            timeDisplay.textContent = '00:00:00.000 / 00:00:00.000';
            timeSlider.value = '0';
            return;
          }
          const clamped = Math.max(0, Math.min(elapsed, totalDurationMs));
          if (!userAdjustingSlider || force) {
            timeSlider.value = String(clamped);
          }
          timeDisplay.textContent = `${formatTimecode(clamped)} / ${formatTimecode(totalDurationMs)}`;
        }

        function findCueIndexForElapsed(elapsed) {
          if (!cues.length) return 0;
          let low = 0;
          let high = cues.length - 1;
          let result = cues.length;
          while (low <= high) {
            const mid = (low + high) >> 1;
            const cue = cues[mid];
            if (cue.end < elapsed) {
              low = mid + 1;
            } else {
              result = mid;
              high = mid - 1;
            }
          }
          return result;
        }

        function renderCueForElapsed(elapsed) {
          if (!cues.length) {
            if (subtitleEl.innerHTML !== '') subtitleEl.innerHTML = '';
            return;
          }

          if (currentIndex >= cues.length) {
            if (subtitleEl.innerHTML !== '') subtitleEl.innerHTML = '';
            return;
          }

          const cue = cues[currentIndex];
          if (elapsed >= cue.start && elapsed <= cue.end) {
            const html = escapeHtml(cue.text).replace(/\n/g, '<br>');
            if (subtitleEl.innerHTML !== html) {
              subtitleEl.innerHTML = html;
            }
          } else if (elapsed < cue.start) {
            if (subtitleEl.innerHTML !== '') subtitleEl.innerHTML = '';
          } else if (elapsed > cue.end) {
            // Elapsed is past this cue; bump index and try again recursively
            currentIndex = Math.min(currentIndex + 1, cues.length);
            renderCueForElapsed(elapsed);
          }
        }

        function getElapsedMs() {
          return playing ? Date.now() - startEpochMs : pausedElapsedMs;
        }

        function clearTimer() {
          if (timerId !== null) {
            clearInterval(timerId);
            timerId = null;
          }
        }

        function resetPlaybackState({ elapsed = 0 } = {}) {
          clearTimer();
          playing = false;
          startEpochMs = 0;
          pausedElapsedMs = Math.max(0, Math.min(elapsed, totalDurationMs));
          currentIndex = findCueIndexForElapsed(pausedElapsedMs);
          renderCueForElapsed(pausedElapsedMs);
          updateTimeUI(pausedElapsedMs, { force: true });
          pauseBtn.textContent = 'Pause';
        }

        function startPlayback() {
          if (!cues.length) return;
          const sliderValue = Number(timeSlider.value) || 0;
          const startAt = Math.max(0, Math.min(sliderValue, totalDurationMs));
          resetPlaybackState({ elapsed: startAt });
          playing = true;
          startEpochMs = Date.now() - pausedElapsedMs;
          pauseBtn.disabled = false;
          setStatus('Playing…');
          timerId = setInterval(tick, 100);
        }

        function pauseOrResume() {
          if (!cues.length) return;
          if (playing) {
            // Pause
            const now = Date.now();
            pausedElapsedMs = now - startEpochMs;
            playing = false;
            clearTimer();
            pauseBtn.textContent = 'Resume';
            setStatus('Paused at ' + (pausedElapsedMs / 1000).toFixed(1) + 's');
            updateTimeUI(pausedElapsedMs, { force: true });
          } else {
            // Resume
            playing = true;
            startEpochMs = Date.now() - pausedElapsedMs;
            pauseBtn.textContent = 'Pause';
            setStatus('Playing…');
            timerId = setInterval(tick, 100);
          }
        }

        function tick() {
          if (!playing) return;
          const elapsed = Date.now() - startEpochMs;
          currentIndex = findCueIndexForElapsed(elapsed);
          if (currentIndex >= cues.length) {
            subtitleEl.innerHTML = '';
            pausedElapsedMs = totalDurationMs;
            updateTimeUI(totalDurationMs, { force: true });
            setStatus('Finished');
            clearTimer();
            playing = false;
            pauseBtn.textContent = 'Pause';
            return;
          }

          renderCueForElapsed(elapsed);
          updateTimeUI(elapsed);
        }

        function seekTo(elapsed) {
          if (!cues.length) return;
          const clamped = Math.max(0, Math.min(elapsed, totalDurationMs));
          pausedElapsedMs = clamped;
          currentIndex = findCueIndexForElapsed(clamped);
          renderCueForElapsed(clamped);
          updateTimeUI(clamped, { force: true });
          if (playing) {
            startEpochMs = Date.now() - clamped;
          }
        }

        function handleScrubStatus(elapsed) {
          if (!playing) {
            setStatus('Scrubbed to ' + formatTimecodeShort(elapsed));
          }
        }

        fileInput.addEventListener('change', (e) => {
          const file = fileInput.files && fileInput.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              cues = parseSrt(String(reader.result || ''));
              if (cues.length === 0) {
                setStatus('Could not parse SRT');
                startBtn.disabled = true;
                pauseBtn.disabled = true;
                timeSlider.disabled = true;
                return;
              }
              totalDurationMs = cues[cues.length - 1].end;
              timeSlider.disabled = false;
              timeSlider.max = String(totalDurationMs);
              timeSlider.value = '0';
              updateTimeUI(0, { force: true });
              resetPlaybackState();
              startBtn.disabled = false;
              pauseBtn.disabled = true;
              setStatus('Loaded ' + cues.length + ' cues');
            } catch (err) {
              console.error(err);
              setStatus('Error reading SRT');
              startBtn.disabled = true;
              pauseBtn.disabled = true;
              timeSlider.disabled = true;
            }
          };
          reader.onerror = () => {
            setStatus('Failed to read file');
          };
          reader.readAsText(file);
        });

        startBtn.addEventListener('click', startPlayback);
        pauseBtn.addEventListener('click', pauseOrResume);

        timeSlider.addEventListener('pointerdown', () => {
          userAdjustingSlider = true;
        });
        timeSlider.addEventListener('pointerup', () => {
          userAdjustingSlider = false;
        });
        timeSlider.addEventListener('pointercancel', () => {
          userAdjustingSlider = false;
        });

        timeSlider.addEventListener('input', () => {
          if (!cues.length) return;
          const target = Number(timeSlider.value) || 0;
          seekTo(target);
        });

        timeSlider.addEventListener('change', () => {
          if (!cues.length) return;
          const target = Number(timeSlider.value) || 0;
          handleScrubStatus(target);
        });

        stageEl.addEventListener('wheel', (event) => {
          if (!cues.length) return;
          event.preventDefault();
          const modifier = event.ctrlKey || event.metaKey ? 50 : event.shiftKey ? 150 : 400;
          const delta = event.deltaY * modifier;
          const newElapsed = getElapsedMs() + delta;
          seekTo(newElapsed);
          handleScrubStatus(pausedElapsedMs);
        }, { passive: false });

        // Prevent screen dimming as much as possible by keeping interactions simple
        // and minimizing unnecessary reflows. For iOS, consider turning off Auto-Lock in Settings for long sessions.
      })();
    </script>
  </body>
  </html>
